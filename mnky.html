<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Monkey Wrench</title>
<style>
body{margin:0;background:#111;display:flex;flex-direction:column;align-items:center;font-family:monospace;color:#eee;user-select:none;-webkit-user-select:none}
canvas{border:4px solid #444;margin-top:10px;max-width:100%;height:auto;touch-action:none;image-rendering:pixelated}
p{margin:6px;text-align:center}
#pad{display:flex;gap:8px;margin:8px;flex-wrap:wrap;justify-content:center}
#pad button{font:bold 20px monospace;width:64px;height:56px;background:#333;color:#ffd400;border:2px solid #666;border-radius:8px;touch-action:none}
</style></head><body>
<canvas id="c" width="800" height="520"></canvas>
<div id="pad">
<button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button>
<button data-k="ArrowUp">▲</button><button data-k="ArrowDown">▼</button>
<button data-k="Space">JUMP</button>
</div>
<p>← → move · ↑ ↓ climb · SPACE jump · Stomp enemies · Carry parts to the broken machine · ENTER/tap to start</p>
<script>
window.onerror=(m,s,l)=>{alert('Error on line '+l+': '+m)};
const C=document.getElementById('c'),X=C.getContext('2d');
X.imageSmoothingEnabled=false;
const K={};
onkeydown=e=>{K[e.code]=1;if(e.code=='Enter')start();if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault()};
onkeyup=e=>K[e.code]=0;

// ===== SPRITES =====
function mk(rows,pal,s=2){const c=document.createElement('canvas');c.width=rows[0].length*s;c.height=rows.length*s;
 const g=c.getContext('2d');rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch!='.'){g.fillStyle=pal[ch];g.fillRect(x*s,y*s,s,s)}}));return c}
function blit(img,x,y,flip){if(!flip){X.drawImage(img,Math.round(x),Math.round(y));return}
 X.save();X.translate(Math.round(x)+img.width,Math.round(y));X.scale(-1,1);X.drawImage(img,0,0);X.restore()}
function spin(img,cx,cy,a){X.save();X.translate(cx,cy);X.rotate(a);X.drawImage(img,-img.width/2,-img.height/2);X.restore()}

const FP={Y:'#ffd400',S:'#f1c27d',K:'#222',R:'#d62828',B:'#1d4ed8',N:'#6b3e1e'};
const FHEAD=["...YYYYYY...","..YYYYYYYY..",".YYYYYYYYYY.","...SSSSSS...","...SKSSKS...","...SSSSSS...","....SSSS...."];
const FBACK=["...YYYYYY...","..YYYYYYYY..",".YYYYYYYYYY.","...SSSSSS...","...SSSSSS...","...SSSSSS...","....SSSS...."];
const FBODY=["..RRBBBBRR..",".RRRBBBBRRR.",".S.RBBBBR.S.","...BBBBBB...","...BBBBBB..."];
const FR={
 stand:mk([...FHEAD,...FBODY,"...BB..BB...","...BB..BB...","..NNN..NNN..","..NNN..NNN.."],FP),
 walk1:mk([...FHEAD,...FBODY,"..BB...BB...","..BB....BB..",".NNN....NNN.",".NNN....NNN."],FP),
 walk2:mk([...FHEAD,...FBODY,"....BBBB....","....BBBB....","...NNNNNN...","...NNNNNN..."],FP),
 jump:mk([...FHEAD,"S.RRBBBBRR.S","SRRRBBBBRRRS","...RBBBBR...","...BBBBBB...","...BBBBBB...","..BB....BB..","..NN....NN..","............","............"],FP),
 climb1:mk([...FBACK,"S.RRBBBBRR..","SRRRBBBBRRR.","...RBBBBR.S.","...BBBBBB...","...BBBBBB...","...BB..BB...","...BB..NNN..","..NNN.......","............"],FP),
 climb2:mk([...FBACK,"..RRBBBBRR.S",".RRRBBBBRRRS",".S.RBBBBR...","...BBBBBB...","...BBBBBB...","...BB..BB...","..NNN..BB...",".......NNN..","............"],FP)
};
const MP={M:'#7a4a21',F:'#e0b080',K:'#111'};
const MTOP=["....MMMMMM....","...MMMMMMMM...","..MMFFFFFFMM..","..MFKFFFFKFM..","..MFFFFFFFFM..","...MFFKKFFM..."];
const MK={
 idle:mk([...MTOP,"....MMMMMM....","..MMMMMMMMMM..",".MM.MMFFMM.MM.",".M..MFFFFM..M.","....MMMMMM....","....MM..MM....","...MMM..MMM...",".............."],MP),
 throw:mk([...MTOP,".M..MMMMMM..M.","MM.MMMMMMMM.MM","M..MMMFFMMM..M","....MFFFFM....","....MMMMMM....","....MM..MM....","...MMM..MMM...",".............."],MP)
};
const GP={G:'#3fbf3f',R:'#ff2020',W:'#fff'};
const GTOP=["G..........G","GG.GGGGGG.GG",".GGGGGGGGGG.","..GRRGGRRG..","..GGGGGGGG..","..GWGWGWGG..","...GGGGGG...","..GGGGGGGG..",".G.GGGGGG.G."];
const GR={a:mk([...GTOP,"...GG..GG...","..GG....GG..","............"],GP),b:mk([...GTOP,"...GG..GG...","...GG..GG...","............"],GP)};
const CLOUD=mk(["....CCCC........","..CCCCCCCC.CCC..",".CCCCCCCCCCCCCC.","CCCDDCCCCCDDCCCC","CCCCCCCCCCCCCCCC",".CCCCDDDDDCCCCC.","..CCCCCCCCCCCC..",".....YY.........","....YY..........","...YYYY.........",".....YY.........","....Y..........."],{C:'#9aa0a6',D:'#444',Y:'#ffd400'});
const WR={normal:mk([".LL.....","L..L....","L.LL....",".LLLL...","...LLL..","....LLL.",".....LLL","......LL"],{L:'#c0c6cc'})};
const SP={
 ladder(x,t,h){X.fillStyle='#d4ac0d';X.fillRect(x,t,4,h);X.fillRect(x+20,t,4,h);for(let y=t+8;y<t+h;y+=12)X.fillRect(x,y,24,3)},
 girder(x,y,w,c){X.fillStyle=c;X.fillRect(x,y,w,10);X.fillStyle='rgba(255,255,255,.25)';X.fillRect(x,y,w,2);
  X.fillStyle='rgba(0,0,0,.35)';for(let i=x;i<x+w;i+=20)X.fillRect(i,y+5,10,5);
  X.fillStyle='#222';for(let i=x+4;i<x+w;i+=20)X.fillRect(i,y+3,2,2)},
 machine(m,name,icon,prog,fc){
  X.fillStyle='#444';X.fillRect(m.x,m.y-m.h,m.w,m.h);
  X.fillStyle='#666';X.fillRect(m.x+4,m.y-m.h+4,m.w-8,m.h-14);
  X.fillStyle=prog>=1?'#2ecc71':(Math.floor(fc/15)%2?'#f33':'#600');X.fillRect(m.x+8,m.y-m.h+8,6,6);
  X.font='22px serif';X.textAlign='left';X.fillText(icon,m.x+20,m.y-16);
  X.fillStyle='#111';X.fillRect(m.x,m.y-6,m.w,6);X.fillStyle='#2ecc71';X.fillRect(m.x,m.y-6,m.w*prog,6);
  if(prog<1){X.fillStyle='rgba(200,200,200,.6)';for(let i=0;i<3;i++){const t=(fc+i*20)%60;
   X.fillRect(m.x+44+Math.sin(t*.2)*3,m.y-m.h-t*.6,4+t/15,4+t/15)}}
  text(name,m.x+m.w/2,m.y-m.h-8,11,'#ff0')},
 part(x,y,k,fc){const c=['#bbb','#e67e22','#3498db','#e74c3c'][k];y+=Math.sin(fc*.1+k)*2;
  X.fillStyle=c;X.fillRect(x+4,y+4,12,12);X.fillRect(x+8,y,4,20);X.fillRect(x,y+8,20,4);X.fillStyle='#222';X.fillRect(x+8,y+8,4,4)},
 powerup(x,y,icon,fc){y+=Math.sin(fc*.12)*2;X.fillStyle='#ffd400';X.fillRect(x-2,y-2,26,26);X.fillStyle='#222';X.fillRect(x,y,22,22);
  X.font='16px serif';X.textAlign='left';X.fillText(icon,x+2,y+17)},
 bolt(x,y){X.fillStyle='#ffd400';X.fillRect(x+4,y,4,4);X.fillRect(x+2,y+4,4,4);X.fillRect(x,y+8,8,3);X.fillRect(x+4,y+11,4,4);X.fillRect(x+2,y+15,4,3)},
 hammer(x,y,f,fc){const a=Math.sin(fc*.3)*.8;X.save();X.translate(x+(f>0?22:2),y-16);X.scale(f,1);X.rotate(a);
  X.fillStyle='#8b5a2b';X.fillRect(0,-2,14,4);X.fillStyle='#bbb';X.fillRect(12,-7,8,14);X.restore()}
};
function text(s,x,y,sz,c,al){X.font='bold '+sz+'px monospace';X.textAlign=al||'center';
 X.fillStyle='#000';X.fillText(s,x+2,y+2);X.fillStyle=c;X.fillText(s,x,y)}

// ===== GAME DATA =====
const LAYOUTS=[
 {p:[[0,490,800],[0,390,340],[420,390,380],[60,290,680],[0,190,300],[380,190,420],[250,90,300]],
  l:[[700,390,490],[90,390,490],[200,290,390],[600,290,390],[120,190,290],[520,190,290],[400,90,190]]},
 {p:[[0,490,800],[100,390,600],[0,290,250],[330,290,470],[150,190,500],[0,90,200],[600,90,200]],
  l:[[130,390,490],[640,390,490],[180,290,390],[450,290,390],[220,190,290],[560,190,290],[100,90,190],[660,90,190]]},
 {p:[[0,490,800],[0,390,250],[300,390,200],[550,390,250],[0,290,800],[100,190,250],[450,190,250],[275,90,250]],
  l:[[60,390,490],[380,390,490],[720,390,490],[200,290,390],[600,290,390],[150,190,290],[600,190,290],[300,90,190],[480,90,190]]},
 {p:[[0,490,800],[50,390,700],[0,290,350],[450,290,350],[100,190,600],[300,90,200]],
  l:[[80,390,490],[700,390,490],[300,290,390],[480,290,390],[150,190,290],[650,190,290],[340,90,190],[440,90,190]]}
];
const THEMES=[
 {name:"Joe's Diner",fix:"Grill",icon:"🍳",bg:"#3b1f1f",plat:"#c0392b"},
 {name:"Mama Mia Pizzeria",fix:"Pizza Oven",icon:"🍕",bg:"#2b2b14",plat:"#27ae60"},
 {name:"Suds Laundromat",fix:"Washer",icon:"🧺",bg:"#14263b",plat:"#2980b9"},
 {name:"ByteCorp Office",fix:"Copy Machine",icon:"🖨️",bg:"#222",plat:"#7f8c8d"},
 {name:"Big Burger Barn",fix:"Soda Fountain",icon:"🥤",bg:"#3b2a10",plat:"#e67e22"},
 {name:"Speedy Car Wash",fix:"Brush Motor",icon:"🚗",bg:"#102b2b",plat:"#16a085"}
];
const PW=[{t:'clock',i:'⏰'},{t:'hammer',i:'🔨'},{t:'life',i:'❤️'},{t:'coffee',i:'☕'},{t:'wrench',i:'💥'}];
let state='title',level=0,lives=3,score=0,time,P,plats,ladders,pieces,enemies,shots,powers,machine,fixed,need,msgT=0,msg='',puTimer,fx=[],FC=0;
const W=24,H=32;
function start(){
 if(state=='title'||state=='over'){level=0;lives=3;score=0;loadLevel();state='play'}
 else if(state=='clear'){level++;loadLevel();state='play'}
}
function loadLevel(){
 const L=LAYOUTS[level%LAYOUTS.length],T=THEMES[level%THEMES.length];
 plats=L.p.map(a=>({x:a[0],y:a[1],w:a[2]}));
 ladders=L.l.map(a=>({x:a[0],t:a[1],b:a[2]}));
 const top=plats.reduce((a,b)=>b.y<a.y?b:a);
 machine={x:top.x+top.w/2-30,y:top.y,w:60,h:50};
 need=4+Math.min(level,6);fixed=0;
 pieces=[];for(let i=0;i<need;i++)pieces.push(placeRandom({s:'loose'}));
 // ======= Enemies =========
 enemies=[];const sp=1+level*0.15;
 const nm=2+Math.floor(level/2),ng=2+Math.floor((level+1)/2),nmu=level>=2?1:0;
 for(let i=0;i<nm;i++)enemies.push(mkEnemy('monkey',sp));
 for(let i=0;i<ng;i++)enemies.push(mkEnemy('gremlin',sp*1.2));
 for(let i=0;i<nmu;i++)enemies.push(mkEnemy('murphy',sp*0.8));
 shots=[];powers=[];fx=[];puTimer=300;
 time=Math.max(60,100-level*4)*60;
 resetPlayer();
 msg=T.name+" — Fix the "+T.fix+"!";msgT=150;
}
function placeRandom(o){const pl=plats[1+Math.floor(Math.random()*(plats.length-1))];
 o.x=pl.x+10+Math.random()*(pl.w-40);o.y=pl.y;return o}
function mkEnemy(type,sp){const pl=plats[1+Math.floor(Math.random()*(plats.length-1))];
 return{type,x:pl.x+Math.random()*(pl.w-28),y:pl.y,pl,dir:Math.random()<.5?-1:1,sp,stun:0,cd:120+Math.random()*120,carry:null,ct:0}}
function respawn(e){const n=mkEnemy(e.type,e.sp);Object.assign(e,n);e.stun=120}
function resetPlayer(){P={x:30,y:490,vx:0,vy:0,climb:false,carry:null,inv:120,hammer:0,coffee:0,face:1,ground:true}}
function hurt(){
 if(P.inv>0||P.hammer>0)return;
 lives--;
 if(P.carry){P.carry.s='loose';placeRandom(P.carry);P.carry=null}
 fx.push({x:P.x,y:P.y-20,t:40,s:'OUCH!'});
 if(lives<=0){state='over';return}
 resetPlayer();
}
function onLadder(){const cx=P.x+W/2;return ladders.find(l=>cx>l.x-4&&cx<l.x+28&&P.y>=l.t-2&&P.y<=l.b+2)}
function hit(a,b,aw,ah,bw,bh){return a.x<b.x+bw&&a.x+aw>b.x&&a.y-ah<b.y&&a.y>b.y-bh}
function update(){
 if(msgT>0)msgT--;
 if(--time<=0){lives--;if(lives<=0){state='over';return}
  loadLevel();msg="TIME'S UP! Try again!";msgT=120;return}
 const spd=P.coffee>0?5:3;
 const lad=onLadder();
 if(lad&&((K.ArrowUp&&P.y>lad.t)||(K.ArrowDown&&P.y<lad.b))){P.climb=true;P.x=lad.x;P.vy=0}
 if(P.climb){
  if(!lad)P.climb=false;
  else{if(K.ArrowUp)P.y-=2.5;if(K.ArrowDown)P.y+=2.5;
   if(P.y<=lad.t){P.y=lad.t;P.climb=false;P.ground=true}
   if(P.y>=lad.b){P.y=lad.b;P.climb=false;P.ground=true}}
 }
 if(!P.climb){
  P.vx=(K.ArrowRight?spd:0)-(K.ArrowLeft?spd:0);if(P.vx)P.face=Math.sign(P.vx);
  if(K.Space&&P.ground){P.vy=-10;P.ground=false}
  P.vy+=0.55;const oy=P.y;P.x+=P.vx;P.y+=P.vy;
  P.x=Math.max(0,Math.min(800-W,P.x));P.ground=false;
  if(P.vy>=0)for(const pl of plats)
   if(oy<=pl.y&&P.y>=pl.y&&P.x+W>pl.x&&P.x<pl.x+pl.w){P.y=pl.y;P.vy=0;P.ground=true}
  if(P.y>540){P.inv=0;P.hammer=0;hurt();if(state!='play')return}
 }
 if(P.inv>0)P.inv--;if(P.hammer>0)P.hammer--;if(P.coffee>0)P.coffee--;
 for(const pc of pieces)
  if(pc.s=='loose'&&!P.carry&&hit(P,pc,W,H,22,22)){pc.s='player';P.carry=pc;score+=50}
 if(P.carry){
  P.carry.x=P.x;P.carry.y=P.y-H;
  if(hit(P,machine,W,H,machine.w,machine.h)){
   P.carry.s='done';P.carry=null;fixed++;score+=200;
   fx.push({x:machine.x,y:machine.y-60,t:50,s:'+200 FIXED!'});
   if(fixed>=need){score+=Math.floor(time/60)*20;state='clear';return}
  }
 }
 for(const e of enemies){
  if(e.stun>0){e.stun--;continue}
  if(e.type=='gremlin'&&!e.carry){
   const t=pieces.find(p=>p.s=='loose'&&p.y==e.pl.y&&p.x>e.pl.x-5&&p.x<e.pl.x+e.pl.w);
   if(t){e.dir=Math.sign(t.x-e.x)||1;if(Math.abs(t.x-e.x)<6){e.carry=t;t.s='gremlin';e.ct=150}}
  }
  if(e.carry){e.carry.x=e.x;e.carry.y=e.y-28;
   if(--e.ct<=0){e.carry.s='loose';placeRandom(e.carry);fx.push({x:e.x,y:e.y-30,t:40,s:'POOF! hehehe'});e.carry=null}}
  e.x+=e.dir*e.sp;
  if(e.x<e.pl.x){e.x=e.pl.x;e.dir=1}
  if(e.x+28>e.pl.x+e.pl.w){e.x=e.pl.x+e.pl.w-28;e.dir=-1}
  if(e.type=='monkey'&&--e.cd<=0){
   e.cd=Math.max(60,150+Math.random()*120-level*8);
   shots.push({x:e.x+14,y:e.y-20,vx:(P.x>e.x?1:-1)*(3+level*.2),vy:-4});
  }
  if(e.type=='murphy'&&--e.cd<=0){e.cd=200;shots.push({x:e.x+14,y:e.y-40,vx:0,vy:1,drop:1})}
  if(hit(P,e,W,H,28,28)){
   if(P.hammer>0){score+=300;fx.push({x:e.x,y:e.y-30,t:40,s:'BONK! +300'});
    if(e.carry){e.carry.s='loose';e.carry=null}respawn(e)}
   else if(P.vy>0&&P.y-e.y<-10){
    e.stun=180;P.vy=-7;score+=100;
    if(e.carry){e.carry.s='loose';e.carry.y=e.y;e.carry=null}
    fx.push({x:e.x,y:e.y-30,t:30,s:'+100'});
   }
   else{hurt();if(state!='play')return}
  }
 }
 for(const s of shots){s.x+=s.vx;s.y+=s.vy;s.vy+=s.drop?0.1:0.2;
  if(hit(P,s,W,H,16,16)){s.y=999;hurt();if(state!='play')return}}
 shots=shots.filter(s=>s.y<560&&s.x>-20&&s.x<820);
 if(--puTimer<=0){
  puTimer=400+Math.random()*300;
  const t=PW[Math.floor(Math.random()*PW.length)];
  if(!(t.t=='life'&&Math.random()<.5))powers.push(placeRandom({...t,life:600}));
 }
 for(const p of powers){
  p.life--;
  if(hit(P,p,W,H,22,22)){
   p.life=0;score+=100;
   if(p.t=='clock')time+=900;
   if(p.t=='hammer')P.hammer=480;
   if(p.t=='life')lives++;
   if(p.t=='coffee')P.coffee=480;
   if(p.t=='wrench')enemies.forEach(e=>e.stun=240);
   fx.push({x:p.x,y:p.y-30,t:40,s:p.t.toUpperCase()+'!'});
  }
 }
 powers=powers.filter(p=>p.life>0);
 fx.forEach(f=>{f.t--;f.y-=.5});fx=fx.filter(f=>f.t>0);
}
function draw(){
 X.fillStyle='#111';X.fillRect(0,0,800,520);
 if(state=='title'){
  text('MONKEY WRENCH',400,190,48,'#ffd400');
  blit(FR.stand,350,250);blit(MK.idle,420,254);
  text('Press ENTER or tap to start',400,350,18,'#fff');return}
 const T=THEMES[level%THEMES.length];
 X.fillStyle=T.bg;X.fillRect(0,0,800,520);
 for(const l of ladders)SP.ladder(l.x,l.t,l.b-l.t);
 for(const pl of plats)SP.girder(pl.x,pl.y,pl.w,T.plat);
 SP.machine(machine,T.fix,T.icon,fixed/need,FC);
 pieces.forEach((pc,i)=>{if(pc.s!='done')SP.part(pc.x,pc.y-22,i%4,FC)});
 for(const p of powers)if(p.life>120||FC%10<5)SP.powerup(p.x,p.y-24,p.i,FC);
 for(const e of enemies){
  if(e.stun>0&&FC%8<4)X.globalAlpha=.5;
  if(e.type=='monkey')blit(e.cd<20?MK.throw:MK.idle,e.x,e.y-28,e.dir<0);
  else if(e.type=='gremlin')blit(FC%20<10?GR.a:GR.b,e.x+2,e.y-24,e.dir<0);
  else blit(CLOUD,e.x-2,e.y-48+Math.sin(FC*.05)*3);
  X.globalAlpha=1;
  if(e.stun>0)text('*',e.x+14,e.y-32,14,'#ff0');
 }
 for(const s of shots){if(s.drop)SP.bolt(s.x,s.y-18);else spin(WR.normal,s.x+8,s.y-8,FC*.4)}
 if(!(P.inv>0&&FC%6<3)){
  let f;
  if(P.climb)f=Math.floor(P.y/8)%2?FR.climb1:FR.climb2;
  else if(!P.ground)f=FR.jump;
  else if(P.vx)f=Math.floor(FC/6)%2?FR.walk1:FR.walk2;
  else f=FR.stand;
  blit(f,P.x,P.y-H,P.face<0&&!P.climb);
  if(P.hammer>0)SP.hammer(P.x,P.y,P.face,FC);
 }
 text('SCORE '+score,10,22,16,'#fff','left');
 text('LIVES '+Math.max(0,lives),10,44,14,'#f55','left');
 text('LEVEL '+(level+1),400,22,16,'#ffd400');
 text('TIME '+Math.max(0,Math.ceil(time/60)),790,22,16,time<600?'#f33':'#fff','right');
 text('PARTS '+fixed+'/'+need,790,44,14,'#2ecc71','right');
 for(const f of fx)text(f.s,f.x+12,f.y,13,'#fff');
 if(msgT>0)text(msg,400,260,22,'#ffd400');
 if(state=='clear'||state=='over'){X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,800,520)}
 if(state=='clear'){
  text(T.fix.toUpperCase()+' FIXED!',400,230,36,'#2ecc71');
  text('Score: '+score,400,275,20,'#fff');
  text('ENTER or tap for the next job',400,315,16,'#ffd400')}
 if(state=='over'){
  text('GAME OVER',400,230,44,'#f33');
  text('Final score: '+score,400,275,20,'#fff');
  text('ENTER or tap to play again',400,315,16,'#ffd400')}
}

// ===== TOUCH CONTROLS =====
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
