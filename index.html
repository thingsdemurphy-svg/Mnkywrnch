<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Monkey Wrench</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; touch-action: none; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden;
      font-family: "Courier New", monospace; color: #fff; }
  #wrap { position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  #screen { position: relative; margin-top: 6px; }
  /*canvas { display: block; background: #000; image-rendering: pixelated;
      image-rendering: crisp-edges; border: 3px solid #333; border-radius: 4px; }*/
  canvas { display: block; background: #000;
    image-rendering: auto;                 /* smooth upscaling instead of hard pixels */
    filter: blur(0.3px) contrast(1.15) saturate(1.25) brightness(1.1);
    border: 3px solid #333; border-radius: 18px;
    box-shadow: 0 0 25px rgba(120,200,255,0.25), inset 0 0 40px #000; }

 /* Title / message overlay */
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      background: rgba(0,0,0,0.85); z-index: 5; }
  .overlay.hidden { display: none; }
  .logo { font-size: 38px; font-weight: bold; color: #ffd400; letter-spacing: 3px;
      text-shadow: 3px 3px 0 #c40000, 6px 6px 0 #000; animation: bob 1.2s ease-in-out infinite; }
  .sub { margin-top: 8px; color: #7fd7ff; font-size: 13px; }
  .blink { margin-top: 26px; font-size: 18px; color: #fff; animation: blink 0.9s steps(2) infinite; }
  .hint { margin-top: 18px; font-size: 11px; color: #aaa; line-height: 1.6; }
  #hiScore { margin-top: 10px; color: #ff7fd1; font-size: 13px; }
  .btn { margin-top: 18px; padding: 12px 26px; font-size: 18px; font-family: inherit;
      font-weight: bold; color: #000; background: #ffd400; border: 3px solid #fff;
      border-radius: 6px; box-shadow: 0 4px 0 #a07a00; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a07a00; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes bob { 50% { transform: translateY(-6px); } }

  /* Touch controls */
  #controls { width: 100%; max-width: 520px; display: flex; flex-direction: row-reverse; justify-content: space-between;
      align-items: center; padding: 10px 14px; flex: 1; }
  .dpad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 58px); gap: 6px; }
  .cbtn { display: flex; align-items: center; justify-content: center; font-size: 24px;
      font-weight: bold; color: #fff; background: #222; border: 2px solid #555;
      border-radius: 12px; }
  .cbtn.on { background: #ffd400; color: #000; border-color: #fff; }
  #bUp { grid-column: 2; grid-row: 1; }
  #bLeft { grid-column: 1; grid-row: 2; }
  #bDown { grid-column: 2; grid-row: 2; }
  #bRight { grid-column: 3; grid-row: 2; }
  .actions { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  #bJump { width: 86px; height: 86px; border-radius: 50%; background: #c40000; border-color: #ff8080; font-size: 16px; }
  #bJump.on { background: #ff4040; color: #fff; }
  #bPause { width: 70px; height: 34px; font-size: 12px; border-radius: 8px; }
  @media (hover: hover) and (pointer: fine) { #controls { display: none; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="screen">
    <canvas id="game" width="480" height="360"></canvas>

    <div id="title" class="overlay">
      <div class="logo">MONKEY<br>WRENCH</div>
      <div class="sub">Starring FIX-IT FRANKIE</div>
      <div id="hiScore">HI-SCORE 000000</div>
      <button id="startBtn" class="btn">START</button>
      <div class="blink">TAP START</div>
      <div class="hint">
        Collect the parts &bull; Fix the machine<br>
        Dodge wrenches, gremlins &amp; lightning<br>
        Keys: Arrows/WASD move &bull; Space jump &bull; P pause
      </div>
    </div>

    <div id="msg" class="overlay hidden">
      <div id="msgTitle" class="logo" style="font-size:28px"></div>
      <div id="msgText" class="sub"></div>
      <button id="msgBtn" class="btn">CONTINUE</button>
    </div>
  </div>

  <div id="controls">
    <div class="dpad">
      <div class="cbtn" id="bUp" data-k="up">&#9650;</div>
      <div class="cbtn" id="bLeft" data-k="left">&#9664;</div>
      <div class="cbtn" id="bDown" data-k="down">&#9660;</div>
      <div class="cbtn" id="bRight" data-k="right">&#9654;</div>
    </div>
    <div class="actions">
      <div class="cbtn" id="bPause" data-k="pause">PAUSE</div>
      <div class="cbtn" id="bJump" data-k="jump">JUMP</div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ===== PART 1: CORE SETUP + INPUT ===== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
const W = 480, H = 360, TILE = 16;

const Game = {
  state: "title",          // title | playing | paused | levelDone | gameOver
  score: 0, lives: 3, level: 1, time: 0,
  hiScore: parseInt(localStorage.getItem("mw_hi") || "0", 10),
  frame: 0, shake: 0
};
document.getElementById("hiScore").textContent =
  "HI-SCORE " + String(Game.hiScore).padStart(6, "0");

/* ---- Input state ---- */
const Input = { left: false, right: false, up: false, down: false, jump: false,
                jumpPressed: false, pausePressed: false };

function setKey(k, down) {
  if (k === "jump") { if (down && !Input.jump) Input.jumpPressed = true; Input.jump = down; return; }
  if (k === "pause") { if (down) Input.pausePressed = true; return; }
  if (k in Input) Input[k] = down;
}

/* Keyboard */
const KEYMAP = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  Space: "jump", KeyZ: "jump", KeyP: "pause", Escape: "pause" };
window.addEventListener("keydown", e => {
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault(); if (!e.repeat) setKey(k, true); else if (k !== "jump" && k !== "pause") setKey(k, true);
});
window.addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) { e.preventDefault(); setKey(k, false); } });

/* Touch buttons (pointer events work on iOS, Android, desktop) */
document.querySelectorAll(".cbtn").forEach(btn => {
  const k = btn.dataset.k;
  const on = e => { e.preventDefault(); btn.classList.add("on"); setKey(k, true);
                    if (typeof unlockAudio === "function") unlockAudio(); };
  const off = e => { e.preventDefault(); btn.classList.remove("on"); setKey(k, false); };
  btn.addEventListener("pointerdown", on);
  btn.addEventListener("pointerup", off);
  btn.addEventListener("pointercancel", off);
  btn.addEventListener("pointerleave", off);
  btn.addEventListener("contextmenu", e => e.preventDefault());
});
/* Release everything if the app loses focus */
window.addEventListener("blur", () => {
  ["left","right","up","down","jump"].forEach(k => Input[k] = false);
  document.querySelectorAll(".cbtn.on").forEach(b => b.classList.remove("on"));
});
/* Block page scrolling / zoom gestures */
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", e => e.preventDefault());

/* ---- Responsive scaling ---- */
function resize() {
  const ctrlH = window.matchMedia("(hover: hover) and (pointer: fine)").matches ? 20 : 220;
  const scale = Math.min((window.innerWidth - 12) / W, (window.innerHeight - ctrlH) / H);
  const s = Math.max(0.5, scale);
  const scr = document.getElementById("screen");
  canvas.style.width = Math.floor(W * s) + "px";
  canvas.style.height = Math.floor(H * s) + "px";
  scr.style.width = canvas.style.width;
  scr.style.height = canvas.style.height;
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 200));
resize();

/* ---- Overlay helpers ---- */
const titleEl = document.getElementById("title");
const msgEl = document.getElementById("msg");
let msgCallback = null;
function showMessage(title, text, btnLabel, cb) {
  document.getElementById("msgTitle").innerHTML = title;
  document.getElementById("msgText").innerHTML = text;
  document.getElementById("msgBtn").textContent = btnLabel || "CONTINUE";
  msgCallback = cb || null;
  msgEl.classList.remove("hidden");
}
function hideMessage() { msgEl.classList.add("hidden"); }

document.getElementById("msgBtn").addEventListener("click", () => {
  hideMessage(); if (typeof unlockAudio === "function") unlockAudio();
  const cb = msgCallback; msgCallback = null; if (cb) cb();
});
document.getElementById("startBtn").addEventListener("click", () => {
  if (typeof unlockAudio === "function") unlockAudio();
  titleEl.classList.add("hidden");
  if (typeof startGame === "function") startGame();
});

/* Animated title-screen background (runs until the game starts) */
function drawTitleBG() {
  Game.frame++;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 40; i++) {
    const x = (i * 53 + Game.frame * (1 + i % 3)) % W, y = (i * 97) % H;
    ctx.fillStyle = i % 4 ? "#334" : "#ffd400"; ctx.fillRect(x, y, 2, 2);
  }
  ctx.fillStyle = "#c40000";
  for (let y = 60; y < H; y += 70) ctx.fillRect(0, y, W, 6);
  if (Game.state === "title") requestAnimationFrame(drawTitleBG);
}
drawTitleBG();
/* ===== END OF PART 1 — paste Part 2 directly below this line ===== */

/* ===== PART 2: SPRITES + ANIMATION + EFFECTS ===== */
const SCALE = 2;
const PAL = { Y:"#ffd400", S:"#ffc890", B:"#2a5cff", R:"#e02020", K:"#5a2e0a",
  E:"#000", W:"#fff", N:"#7a4316", T:"#e0a868", G:"#3ec43e", D:"#1d6b1d",
  r:"#ff2020", L:"#c8c8d0", M:"#707080", O:"#ff8c00" };

function makeSprite(rows, swap) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let ch = rows[y][x]; if (!ch) continue;
    if (swap && swap[ch]) ch = swap[ch];
    if (PAL[ch]) { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); }
  }
  return c;
}

/* ---- Frankie 12x16 ---- */
const F_HEAD = ["....YYYY....","...YYYYYY...","..YYYYYYYYYY","...SSSSSS...",
                "...SSSESS...","...SSSSSSS..","...SSKKKS...","....SSSS...."];
const F_BACK = ["....YYYY....","...YYYYYY...","..YYYYYYYY..","...SSSSSS...",
                "...SSSSSS...","...SSSSSS...","...SSSSSS...","....SSSS...."];
const F_ARMD = ["..RRBRRBRR..",".SRRBBBBRRS.",".S.BBYBBB.S.","...BBBBBB..."];
const F_ARMU = ["S.RRBRRBRR.S","SRRRBBBBRRRS","...BBYBBB...","...BBBBBB..."];
const F_LEG = {
  stand:["...BB..BB...","...BB..BB...","...BB..BB...","..KKK..KKK.."],
  walk1:["..BB....BB..",".BB......BB.",".BB......BB.","KKK......KKK"],
  walk2:["....BBBB....","....BBBB....","....BBBB....","...KKKKKK..."],
  jump: ["..BB....BB..","..BB....BB..",".KKK....KKK.","............"]
};
const FR = {
  stand: makeSprite([...F_HEAD,...F_ARMD,...F_LEG.stand]),
  walk1: makeSprite([...F_HEAD,...F_ARMD,...F_LEG.walk1]),
  walk2: makeSprite([...F_HEAD,...F_ARMD,...F_LEG.walk2]),
  jump:  makeSprite([...F_HEAD,...F_ARMU,...F_LEG.jump]),
  climb1:makeSprite([...F_BACK,...F_ARMU,...F_LEG.walk1]),
  climb2:makeSprite([...F_BACK,...F_ARMU,...F_LEG.stand])
};
const FRANKIE_W = 24, FRANKIE_H = 32;

/* ---- Monkey 14x14 ---- */
const M_HEAD = ["....NNNNNN....","...NNNNNNNN...","..NNTTNNTTNN..",".TNTETTTTETNT.",
                ".TNTTTTTTTTNT.","..NNTTKKTTNN..","...NNTTTTNN...","....NNNNNN...."];
const M_FEET = ["....NN..NN....","...TTT..TTT...",".............."];
const MK = {
  idle: makeSprite([...M_HEAD,"..NNNNNNNNNN..",".NN.NNTTNN.NN.",".TT.NNTTNN.TT.",...M_FEET]),
  throw:makeSprite([...M_HEAD,"TT..NNNNNN..TT",".NN.NNTTNN.NN.","..NNNNTTNNNN..",...M_FEET])
};
const MONKEY_W = 28, MONKEY_H = 28;

/* ---- Gremlin 12x12 ---- */
const G_TOP = ["G..........G","GG..GGGG..GG",".GGGGGGGGGG.","..GrGGGGrG..","..GGGGGGGG..",
               "..GWDWDWDG..","...GGGGGG...","..DGGGGGGD..",".D.GGGGGG.D.","...GG..GG..."];
const GR = { a: makeSprite([...G_TOP,"..GG....GG..","............"]),
             b: makeSprite([...G_TOP,"....GGGG....","............"]) };
const GREMLIN_W = 24, GREMLIN_H = 24;

/* ---- Wrench 10x10 ---- */
const WR_ART = ["..LL......",".L..L.....",".L..L.....","..LLL.....","....LL....",
                ".....LL...","......LL..",".......LL.","........LM",".........M"];
const WR = { normal: makeSprite(WR_ART), super: makeSprite(WR_ART, { L:"Y", M:"O" }) };
const WRENCH_W = 20;

function blit(img, x, y, flip) {
  const w = img.width * SCALE, h = img.height * SCALE;
  x = Math.round(x); y = Math.round(y);
  if (flip) { ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1);
              ctx.drawImage(img, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(img, x, y, w, h);
}
function spin(img, cx, cy, ang) {
  const w = img.width * SCALE, h = img.height * SCALE;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
  ctx.drawImage(img, -w / 2, -h / 2, w, h); ctx.restore();
}

const Sprites = {
  frankie(x, y, o) {
    const t = o.t || 0;
    if (o.anim === "dead") {
      spin(FR.jump, x + 12, y + 16, Math.min(Math.PI / 2, t * 0.15));
      ctx.fillStyle = "#ffd400";
      for (let i = 0; i < 3; i++) { const a = t * 0.2 + i * 2.1;
        ctx.fillRect(x + 12 + Math.cos(a) * 14, y - 4 + Math.sin(a) * 5, 3, 3); }
      return;
    }
    if (o.flash && Math.floor(t / 4) % 2) return;
    let img = FR.stand, bob = 0;
    if (o.anim === "walk") { img = [FR.walk1, FR.stand, FR.walk2, FR.stand][Math.floor(t / 5) % 4];
                             bob = Math.floor(t / 5) % 2 ? -1 : 0; }
    else if (o.anim === "jump") img = FR.jump;
    else if (o.anim === "climb") img = Math.floor(t / 8) % 2 ? FR.climb1 : FR.climb2;
    blit(img, x, y + bob, o.facing < 0);
    if (o.hammer) this.hammer(x, y, o.facing, t);
  },
  hammer(x, y, facing, t) {
    const up = Math.floor(t / 6) % 2;
    const hx = facing > 0 ? x + 22 : x - 10, hy = up ? y - 8 : y + 12;
    ctx.fillStyle = "#8b5a2b"; ctx.fillRect(hx + 3, hy + 4, 3, 10);
    ctx.fillStyle = "#aaa"; ctx.fillRect(hx - 1, hy, 11, 6);
  },
  monkey(x, y, throwing, t) {
    blit(throwing ? MK.throw : MK.idle, x, y + (Math.floor(t / 15) % 2 ? -2 : 0));
  },
  gremlin(x, y, facing, t) {
    blit(Math.floor(t / 6) % 2 ? GR.a : GR.b, x, y + (Math.floor(t / 6) % 2 ? -1 : 0), facing < 0);
  },
  wrench(x, y, t, isSuper) {
    spin(isSuper ? WR.super : WR.normal, x + 10, y + 10, t * 0.3);
  },
  part(x, y, kind, t) {           // kind 0-3: gear, bolt, pipe, chip
    const by = y + Math.sin(t * 0.1 + x) * 2;
    ctx.save(); ctx.translate(x + 8, by + 8);
    if (kind === 0) { ctx.rotate(t * 0.05); ctx.fillStyle = "#ccc";
      for (let i = 0; i < 6; i++) { ctx.rotate(Math.PI / 3); ctx.fillRect(-2, -8, 4, 4); }
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill();
      ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(0, 0, 2, 0, 7); ctx.fill(); }
    else if (kind === 1) { ctx.fillStyle = "#ffd400"; ctx.fillRect(-6, -6, 12, 4); ctx.fillRect(-2, -2, 4, 9); }
    else if (kind === 2) { ctx.fillStyle = "#3a9cff"; ctx.fillRect(-7, -3, 14, 6);
      ctx.fillStyle = "#1a5c9f"; ctx.fillRect(-8, -4, 3, 8); ctx.fillRect(5, -4, 3, 8); }
    else { ctx.fillStyle = "#1d6b1d"; ctx.fillRect(-6, -5, 12, 10); ctx.fillStyle = "#ffd400";
      for (let i = -5; i < 6; i += 3) { ctx.fillRect(i, -7, 1, 2); ctx.fillRect(i, 5, 1, 2); } }
    ctx.restore();
    if (Math.floor(t / 10) % 3 === 0) { ctx.fillStyle = "#fff"; ctx.fillRect(x + 13, by, 2, 2); }
  },
  powerup(x, y, type, t) {       // clock | hammer | life | coffee | super
    const by = y + Math.sin(t * 0.15) * 3;
    ctx.fillStyle = Math.floor(t / 8) % 2 ? "#fff" : "#ffd400";
    ctx.fillRect(x - 1, by - 1, 18, 18); ctx.fillStyle = "#000"; ctx.fillRect(x, by, 16, 16);
    ctx.save(); ctx.translate(x + 8, by + 8);
    if (type === "clock") { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill();
      ctx.fillStyle = "#000"; ctx.fillRect(-1, -5, 2, 5); ctx.fillRect(0, -1, 4, 2); }
    else if (type === "hammer") { ctx.fillStyle = "#8b5a2b"; ctx.fillRect(-1, -2, 3, 9);
      ctx.fillStyle = "#aaa"; ctx.fillRect(-6, -6, 12, 5); }
    else if (type === "life") { ctx.fillStyle = "#e02020";
      ctx.fillRect(-6, -4, 5, 5); ctx.fillRect(1, -4, 5, 5); ctx.fillRect(-5, 0, 10, 3); ctx.fillRect(-3, 3, 6, 2); }
    else if (type === "coffee") { ctx.fillStyle = "#fff"; ctx.fillRect(-5, -3, 9, 9); ctx.fillRect(4, -1, 2, 4);
      ctx.fillStyle = "#5a2e0a"; ctx.fillRect(-4, -2, 7, 2);
      ctx.fillStyle = "#aaa"; ctx.fillRect(-3, -7 + (t % 10 > 5 ? 1 : 0), 1, 3); ctx.fillRect(1, -7, 1, 3); }
    else { spin(WR.super, 0, 0, t * 0.1); }
    ctx.restore();
  },
  lightning(x, warn, t) {
    if (warn) { ctx.fillStyle = Math.floor(t / 4) % 2 ? "rgba(255,255,0,0.35)" : "rgba(255,255,0,0.1)";
      ctx.fillRect(x - 10, 0, 20, H); return; }
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, 0);
    for (let yy = 20; yy <= H; yy += 20) ctx.lineTo(x + (Math.random() * 16 - 8), yy);
    ctx.stroke(); ctx.strokeStyle = "#ffd400"; ctx.lineWidth = 2; ctx.stroke();
  },
  girder(x, y, w) {
    ctx.fillStyle = "#c40000"; ctx.fillRect(x, y, w, 8);
    ctx.fillStyle = "#ff5050"; ctx.fillRect(x, y, w, 2);
    ctx.fillStyle = "#600";
    for (let i = x; i < x + w; i += 12) { ctx.fillRect(i + 2, y + 3, 2, 2); ctx.fillRect(i + 7, y + 3, 2, 2); }
  },
  ladder(x, y, h) {
    ctx.fillStyle = "#00c8ff"; ctx.fillRect(x, y, 2, h); ctx.fillRect(x + 14, y, 2, h);
    for (let i = y + 4; i < y + h; i += 8) ctx.fillRect(x, i, 16, 2);
  },
  machine(x, y, name, fixed, progress, t) {
    ctx.fillStyle = fixed ? "#2a8c2a" : "#555"; ctx.fillRect(x, y, 48, 40);
    ctx.fillStyle = "#222"; ctx.fillRect(x + 6, y + 6, 36, 16);
    ctx.fillStyle = fixed ? (Math.floor(t / 10) % 2 ? "#7fff7f" : "#3ec43e") : "#900";
    ctx.fillRect(x + 8, y + 8, 32 * (fixed ? 1 : progress), 12);
    if (!fixed && Math.floor(t / 6) % 2) {  // sparks & smoke while broken
      ctx.fillStyle = "#ffd400"; ctx.fillRect(x + 40 + Math.random() * 6, y + Math.random() * 10, 2, 2);
      ctx.fillStyle = "rgba(150,150,150,0.5)";
      ctx.fillRect(x + 20 + Math.sin(t * 0.1) * 4, y - 8 - (t % 20) / 2, 6, 6);
    }
    ctx.fillStyle = "#fff"; ctx.font = "bold 8px Courier New"; ctx.textAlign = "center";
    ctx.fillText(name, x + 24, y + 34); ctx.textAlign = "left";
  }
};

/* ---- Particles (sparks, dust, explosions) ---- */
const Particles = {
  list: [],
  burst(x, y, color, n, speed) {
    for (let i = 0; i < (n || 12); i++) {
      const a = Math.random() * Math.PI * 2, s = (speed || 2) * (0.5 + Math.random());
      this.list.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
        life: 30 + Math.random() * 20, color: color || "#ffd400" });
    }
  },
  dust(x, y) { for (let i = 0; i < 4; i++)
    this.list.push({ x: x + Math.random() * 20, y, vx: (Math.random() - 0.5), vy: -Math.random(),
      life: 15, color: "#888" }); },
  update() { this.list = this.list.filter(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.1; return --p.life > 0; }); },
  draw() { this.list.forEach(p => { ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 2, 2); }); ctx.globalAlpha = 1; }
};

/* ---- Floating score pop-ups ---- */
const Popups = {
  list: [],
  add(x, y, text, color) { this.list.push({ x, y, text, color: color || "#fff", life: 45 }); },
  update() { this.list = this.list.filter(p => { p.y -= 0.6; return --p.life > 0; }); },
  draw() { ctx.font = "bold 10px Courier New";
    this.list.forEach(p => { ctx.globalAlpha = Math.min(1, p.life / 15);
      ctx.fillStyle = "#000"; ctx.fillText(p.text, p.x + 1, p.y + 1);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y); }); ctx.globalAlpha = 1; }
};
/* ===== END OF PART 2 — paste Part 3 directly below this line ===== */
/* ===== PART 3: SOUND EFFECTS + MUSIC (Web Audio, no files) ===== */
const Sound = {
  ac: null, master: null, muted: false, musicOn: false, musicTimer: null, step: 0,

  /* Must be called from a tap/keypress (mobile browsers require this) */
  unlock() {
    try {
      if (!this.ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ac = new AC();
        this.master = this.ac.createGain();
        this.master.gain.value = 0.35;
        this.master.connect(this.ac.destination);
      }
      if (this.ac.state === "suspended") this.ac.resume();
      // iOS: play a silent blip to fully unlock
      const b = this.ac.createBuffer(1, 1, 22050), s = this.ac.createBufferSource();
      s.buffer = b; s.connect(this.master); s.start(0);
    } catch (e) { /* audio unavailable - game still works */ }
  },

  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.35;
    return this.muted;
  },

  /* Core beep: freq start->end, duration, waveform, volume */
  tone(f1, f2, dur, type, vol, delay) {
    if (!this.ac || this.muted) return;
    const t = this.ac.currentTime + (delay || 0);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(f1, t);
    if (f2 && f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol || 0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },

  /* White-noise burst (explosions, thunder, hits) */
  noise(dur, vol, delay, lowpass) {
    if (!this.ac || this.muted) return;
    const t = this.ac.currentTime + (delay || 0);
    const len = Math.floor(this.ac.sampleRate * dur);
    const buf = this.ac.createBuffer(1, len, this.ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ac.createBufferSource(), g = this.ac.createGain();
    src.buffer = buf;
    g.gain.setValueAtTime(vol || 0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    if (lowpass) {
      const f = this.ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lowpass;
      src.connect(f); f.connect(g);
    } else src.connect(g);
    g.connect(this.master); src.start(t);
  },

  /* Play a list of notes: [[freq, duration], ...] */
  seq(notes, type, vol) {
    let d = 0;
    notes.forEach(([f, len]) => { if (f) this.tone(f, f, len * 0.95, type, vol, d); d += len; });
  },

  /* ---- Game sound effects ---- */
  jump()      { this.tone(220, 660, 0.15, "square", 0.2); },
  land()      { this.noise(0.05, 0.1, 0, 800); },
  walk()      { this.tone(110, 90, 0.03, "triangle", 0.12); },
  climb()     { this.tone(330 + Math.random() * 40, 300, 0.04, "triangle", 0.12); },
  collect()   { this.tone(880, 880, 0.06, "square", 0.2); this.tone(1320, 1320, 0.1, "square", 0.2, 0.06); },
  deliver()   { this.seq([[523, .07], [659, .07], [784, .07], [1047, .15]], "square", 0.2); },
  powerup()   { for (let i = 0; i < 6; i++) this.tone(400 + i * 120, 500 + i * 120, 0.06, "square", 0.18, i * 0.05); },
  extraLife() { this.seq([[659, .1], [784, .1], [1319, .1], [1047, .1], [1175, .1], [1568, .25]], "square", 0.2); },
  coffee()    { this.tone(300, 1200, 0.3, "sawtooth", 0.15); },
  clock()     { this.seq([[1568, .05], [0, .05], [1568, .05], [0, .05], [2093, .15]], "square", 0.15); },
  hammerHit() { this.noise(0.12, 0.35, 0, 2000); this.tone(150, 60, 0.15, "square", 0.3); },
  smash()     { this.noise(0.25, 0.4, 0, 3000); this.seq([[784, .05], [988, .05], [1319, .12]], "square", 0.15); },
  throwWrench(){ this.tone(600, 200, 0.18, "sawtooth", 0.12); },
  monkeyTaunt(){ this.seq([[700, .06], [900, .06], [700, .06], [900, .08]], "square", 0.12); },
  gremlin()   { this.tone(1200, 400, 0.2, "sawtooth", 0.12); this.tone(400, 1100, 0.15, "sawtooth", 0.1, 0.15); },
  warn()      { this.tone(1000, 1000, 0.08, "square", 0.12); },
  thunder()   { this.noise(0.08, 0.5, 0, 6000); this.noise(0.9, 0.45, 0.05, 400); },
  hurt()      { this.tone(400, 100, 0.3, "sawtooth", 0.3); this.noise(0.15, 0.3, 0, 1500); },
  tick()      { this.tone(1800, 1800, 0.03, "square", 0.1); },
  machineFixed() {
    this.noise(0.2, 0.2, 0, 1200);
    this.seq([[523, .1], [523, .1], [784, .1], [1047, .3]], "square", 0.22);
    this.seq([[262, .1], [262, .1], [392, .1], [523, .3]], "triangle", 0.25);
  },

  die() {
    this.stopMusic();
    const n = [988, 932, 880, 831, 784, 740, 698, 659];
    n.forEach((f, i) => this.tone(f, f * 0.94, 0.12, "square", 0.25, i * 0.12));
    this.noise(0.3, 0.3, 1.0, 800);
  },
  levelClear() {
    this.stopMusic();
    this.seq([[523, .12], [659, .12], [784, .12], [1047, .12], [784, .12], [1047, .4]], "square", 0.22);
    this.seq([[262, .24], [330, .24], [392, .24], [523, .4]], "triangle", 0.28);
  },
  gameOver() {
    this.stopMusic();
    this.seq([[392, .3], [0, .1], [370, .3], [0, .1], [349, .3], [0, .1], [330, .8]], "triangle", 0.3);
  },
  start() {
    this.seq([[392, .1], [523, .1], [659, .1], [784, .2], [659, .1], [784, .4]], "square", 0.22);
  },

  /* ---- Looping background tune (arcade-style bass + melody) ---- */
  MELODY: [659, 0, 784, 659, 523, 0, 587, 659, 784, 0, 880, 784, 659, 0, 523, 0,
           587, 0, 659, 587, 494, 0, 523, 587, 659, 0, 587, 523, 494, 0, 392, 0],
  BASS:   [131, 131, 196, 196, 131, 131, 196, 196, 175, 175, 262, 262, 175, 175, 262, 262,
           147, 147, 220, 220, 147, 147, 220, 220, 196, 196, 247, 247, 196, 196, 294, 294],

  startMusic(fast) {
    this.stopMusic();
    if (!this.ac) return;
    this.musicOn = true; this.step = 0;
    const beat = fast ? 0.11 : 0.15;  // speeds up when time is low
    this.musicTimer = setInterval(() => {
      if (!this.musicOn || this.muted) return;
      const i = this.step % this.MELODY.length;
      const m = this.MELODY[i], b = this.BASS[i];
      if (m) this.tone(m, m, beat * 0.8, "square", 0.07);
      if (b) this.tone(b, b, beat * 0.9, "triangle", 0.14);
      if (i % 4 === 0) this.noise(0.03, 0.05, 0, 5000); // hi-hat
      this.step++;
    }, beat * 1000);
  },
  stopMusic() {
    this.musicOn = false;
    if (this.musicTimer) { clearInterval(this.musicTimer); this.musicTimer = null; }
  }
};

/* Unlock audio on the first tap, click or key press */
["touchstart", "touchend", "mousedown", "keydown"].forEach(ev =>
  window.addEventListener(ev, () => Sound.unlock(), { passive: true }));

/* Press M to mute or unmute */
window.addEventListener("keydown", e => { if (e.key === "m" || e.key === "M") Sound.toggleMute(); });

/* ===== PART 4A: LEVEL LAYOUT + HELPERS ===== */
function unlockAudio() { Sound.unlock(); }
/* Part 4 uses different sound names than Part 3 — link them */
Sound.pickup     = Sound.collect;
Sound.fixed      = Sound.machineFixed;
Sound.bonk       = Sound.hammerHit;
Sound.gameover   = Sound.gameOver;
Sound.levelclear = Sound.levelClear;

const GRAV = 0.35, MAX_FALL = 7, HUD_H = 24;
const MACHINE_NAMES = ["GENERATOR", "PUMP", "ROBOT", "ROCKET", "REACTOR"];
let girders = [], ladders = [], machine = null;

/* Seeded random so each level's layout is always the same */
let seed = 1;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

function buildLevel(n) {
  seed = n * 7919 + 13;
  girders = []; ladders = [];
  const ROWS = 5, GAP = 62, BASE = H - 12;

  /* Floor is full width; upper rows leave a 40px gap on alternating sides */
  for (let r = 0; r < ROWS; r++) {
    const y = BASE - r * GAP;
    if (r === 0)      girders.push({ x: 0,  y, w: W,      row: 0 });
    else if (r % 2)   girders.push({ x: 0,  y, w: W - 40, row: r });
    else              girders.push({ x: 40, y, w: W - 40, row: r });
  }

  /* Ladders between each pair of rows (fewer on later levels) */
  for (let r = 0; r < ROWS - 1; r++) {
    const top = girders[r + 1].y, h = girders[r].y - top;
    const count = n >= 4 ? 1 + (r % 2) : 2;
    const used = [];
    for (let i = 0; i < count; i++) {
      let x, tries = 0;
      do { x = 60 + Math.floor(rnd() * (W - 140) / 8) * 8; tries++; }
      while (tries < 20 && used.some(u => Math.abs(u - x) < 90));
      used.push(x);
      ladders.push({ x, y: top, h });
    }
  }

  /* Broken machine sits on the top girder */
  const topG = girders[ROWS - 1];
  machine = { x: 52, y: topG.y - 40, w: 48, h: 40,
              name: MACHINE_NAMES[(n - 1) % MACHINE_NAMES.length],
              need: Math.min(3 + n, 8), have: 0, fixed: false };
}

/* ---- Collision helpers ---- */
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
/* Returns the girder an object lands on while falling, or null */
function girderUnder(x, w, footPrev, foot) {
  for (const g of girders)
    if (x + w > g.x && x < g.x + g.w && footPrev <= g.y + 0.5 && foot >= g.y) return g;
  return null;
}
/* Random standing spot on a girder (rows 0..maxRow) */
function randomSpotOnGirder(maxRow) {
  const g = girders[Math.floor(Math.random() * (maxRow + 1))];
  return { x: g.x + 20 + Math.random() * (g.w - 56), y: g.y };
}

function drawLevel() {
  ladders.forEach(l =>
  Sprites.ladder(l.x, l.y, l.h));
  girders.forEach(g => Sprites.girder(g.x, g.y, g.w));
  Sprites.machine(machine.x, machine.y, machine.name, machine.fixed,
                  machine.have / machine.need, Game.frame);
}

/* ===== PART 4B: FRANKIE (PLAYER) MOVEMENT ===== */


/* ---- Player state ---- */
const WALK_SPEED = 1.6, CLIMB_SPEED = 1.3, JUMP_V = -5.2;
const frankie = {
  x: 0, y: 0, w: 14, h: 20, vx: 0, vy: 0,
  facing: 1, onGround: false, climbing: false, ladder: null,
  carrying: 0, invuln: 0, dead: false, deadTimer: 0, animT: 0
};

function resetFrankie() {
  const floor = girders[0];
  Object.assign(frankie, {
    x: W - 40, y: floor.y - frankie.h, vx: 0, vy: 0,
    facing: -1, onGround: true, climbing: false, ladder: null,
    carrying: 0, invuln: 90, dead: false, deadTimer: 0, animT: 0
  });
}

/* Ladder Frankie's centre is over (with a little tolerance) */
function ladderAt(cx, footY) {
  for (const l of ladders)
    if (Math.abs(cx - (l.x + 8)) < 7 && footY >= l.y - 2 && footY <= l.y + l.h + 2) return l;
  return null;
}

function updateFrankie() {
  const f = frankie;
  if (f.dead) { f.deadTimer++; return; }
  if (f.invuln > 0) f.invuln--;

  const cx = f.x + f.w / 2;
  const foot = f.y + f.h;

  /* ---- Start climbing ---- */
  if (!f.climbing && (Input.up || Input.down) && f.onGround) {
    const l = ladderAt(cx, foot);
    /* Up: ladder must rise above us. Down: we must be standing on its top */
    if (l && ((Input.up && foot > l.y + 2) || (Input.down && Math.abs(foot - l.y) < 3))) {
      f.climbing = true; f.ladder = l; f.vx = 0; f.vy = 0;
      f.x = l.x + 8 - f.w / 2;
    }
  }

  /* ---- On a ladder ---- */
  if (f.climbing) {
    const l = f.ladder;
    let dy = 0;
    if (Input.up) dy = -CLIMB_SPEED;
    else if (Input.down) dy = CLIMB_SPEED;
    f.y += dy;
    if (dy) f.animT++;

    /* Reached the top or bottom: step off */
    if (f.y + f.h <= l.y) { f.y = l.y - f.h; f.climbing = false; f.onGround = true; }
    else if (f.y + f.h >= l.y + l.h) { f.y = l.y + l.h - f.h; f.climbing = false; f.onGround = true; }
    Input.jumpPressed = false;
    return;
  }

  /* ---- Walking ---- */
  f.vx = 0;
  if (Input.left)  { f.vx = -WALK_SPEED; f.facing = -1; }
  if (Input.right) { f.vx =  WALK_SPEED; f.facing =  1; }
  if (f.vx && f.onGround) f.animT++;

  /* ---- Jumping ---- */
  if (Input.jumpPressed && f.onGround) {
    f.vy = JUMP_V; f.onGround = false;
    Sound.jump && Sound.jump();
  }
  Input.jumpPressed = false;

  /* ---- Horizontal move + screen edges ---- */
  f.x = Math.max(0, Math.min(W - f.w, f.x + f.vx));

  /* ---- Gravity + landing ---- */
  const prevFoot = f.y + f.h;
  f.vy = Math.min(f.vy + GRAV, MAX_FALL);
  f.y += f.vy;
  const g = f.vy >= 0 ? girderUnder(f.x, f.w, prevFoot, f.y + f.h) : null;
  if (g) { f.y = g.y - f.h; f.vy = 0; f.onGround = true; }
  else f.onGround = false;

  /* Don't jump through the HUD */
  if (f.y < HUD_H) { f.y = HUD_H; f.vy = Math.max(f.vy, 0); }

  /* Fell off the bottom of the screen */
  if (f.y > H) killFrankie();
}

function killFrankie() {
  const f = frankie;
  if (f.dead || f.invuln > 0) return;
  f.dead = true; f.deadTimer = 0; f.carrying = 0;
  Sound.die && Sound.die();
}

function drawFrankie() {
  const f = frankie;
  if (!f.dead && f.invuln > 0 && Math.floor(f.invuln / 4) % 2) return;
  let anim = "stand";
  if (f.dead) anim = "dead";
  else if (f.climbing) anim = "climb";
  else if (!f.onGround) anim = "jump";
  else if (f.vx) anim = "walk";
  /* Sprite is 24x32 while the hitbox is 14x20: centre it and line up the feet */
  Sprites.frankie(f.x - (FRANKIE_W - f.w) / 2, f.y - (FRANKIE_H - f.h), {
    anim, facing: f.facing,
    t: f.dead ? f.deadTimer : f.animT,
    hammer: powerTimer > 0 && !f.dead
  });
}

/* ===== PART 4C: SPARE PARTS, ENEMIES, HAZARDS + POWER-UPS ===== */
let parts = [], gremlins = [], bolts = [], powerups = [], popups = [];
let powerTimer = 0, freezeTimer = 0, boltTimer = 0, powerupTimer = 0;
const MAX_CARRY = 3;

/* Fallback drawing so a missing sprite never crashes the game */
function drawBox(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
function spr(name, fallback, ...args) {
  if (Sprites[name]) Sprites[name](...args); else fallback();
}

/* ---- Set up everything for a new level ---- */
function spawnLevelObjects(n) {
  parts = []; gremlins = []; bolts = []; powerups = []; popups = [];
  powerTimer = 0; freezeTimer = 0;
  boltTimer = 180; powerupTimer = 600;

  /* One extra spare part beyond what the machine needs */
  for (let i = 0; i < machine.need + 1; i++) spawnPart();

  /* Gremlins: more and faster each level, never on the floor at the start */
  const count = Math.min(1 + n, 6);
  for (let i = 0; i < count; i++) {
    const g = girders[1 + (i % (girders.length - 1))];
    gremlins.push({
      x: g.x + 30 + Math.random() * (g.w - 80), y: g.y - 14, w: 14, h: 14,
      dir: Math.random() < 0.5 ? -1 : 1,
      speed: 0.6 + n * 0.12 + Math.random() * 0.3,
      girder: g, stunned: 0, animT: 0
    });
  }
}

function spawnPart() {
  const s = randomSpotOnGirder(girders.length - 2);
  parts.push({ x: s.x, y: s.y - 10, w: 10, h: 10, kind: Math.floor(Math.random() * 3), bob: Math.random() * 6 });
}

function addPopup(x, y, text) { popups.push({ x, y, text, t: 40 }); }
function addPoints(n, x, y) { Game.score += n; if (x !== undefined) addPopup(x, y, "+" + n); }

/* ---- Main update for all objects ---- */
function updateObjects() {
  const f = frankie;
  if (powerTimer > 0) powerTimer--;
  if (freezeTimer > 0) freezeTimer--;

  /* --- Spare parts: pick up --- */
  if (!f.dead) {
    for (let i = parts.length - 1; i >= 0; i--) {
      if (f.carrying < MAX_CARRY && overlap(f, parts[i])) {
        f.carrying++;
        addPoints(50, parts[i].x, parts[i].y);
        parts.splice(i, 1);
        Sound.pickup && Sound.pickup();
      }
    }
  }

  /* --- Deliver parts to the machine --- */
  if (!f.dead && f.carrying > 0 && !machine.fixed && overlap(f, machine)) {
    const give = Math.min(f.carrying, machine.need - machine.have);
    machine.have += give; f.carrying -= give;
    addPoints(200 * give, machine.x + 10, machine.y);
    Sound.deliver && Sound.deliver();
    if (machine.have >= machine.need) {
      machine.fixed = true;
      Sound.fixed && Sound.fixed();
    }
  }

  /* --- Gremlins --- */
  for (const g of gremlins) {
    if (g.stunned > 0) { g.stunned--; continue; }
    if (freezeTimer > 0) continue;
    g.x += g.dir * g.speed; g.animT++;
    const gr = g.girder;
    if (g.x <= gr.x) { g.x = gr.x; g.dir = 1; }
    if (g.x + g.w >= gr.x + gr.w) { g.x = gr.x + gr.w - g.w; g.dir = -1; }
    /* Turn around at random sometimes so they're less predictable */
    if (Math.random() < 0.004) g.dir *= -1;

    if (!f.dead && overlap(f, g)) {
      if (powerTimer > 0) {
        g.stunned = 240;
        addPoints(300, g.x, g.y);
        Sound.bonk && Sound.bonk();
      } else killFrankie();
    }
  }

  /* --- Falling bolts (hazard), more often on later levels --- */
  if (--boltTimer <= 0) {
    boltTimer = Math.max(50, 200 - Game.level * 20) + Math.random() * 60;
    bolts.push({ x: 20 + Math.random() * (W - 40), y: HUD_H, w: 6, h: 8, vy: 0.5 });
  }
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    if (freezeTimer <= 0) { b.vy = Math.min(b.vy + 0.08, 4); b.y += b.vy; }
    if (!f.dead && overlap(f, b)) {
      if (powerTimer > 0) { addPoints(100, b.x, b.y); bolts.splice(i, 1); continue; }
      killFrankie();
    }
    if (b.y > H) bolts.splice(i, 1);
  }

  /* --- Power-ups: wrench (smash enemies), clock (freeze), heart (extra life) --- */
  if (--powerupTimer <= 0) {
    powerupTimer = 700 + Math.random() * 500;
    if (powerups.length < 2) {
      const s = randomSpotOnGirder(girders.length - 2);
      const r = Math.random();
      const type = r < 0.45 ? "wrench" : r < 0.85 ? "clock" : "heart";
      powerups.push({ x: s.x, y: s.y - 12, w: 12, h: 12, type, life: 600 });
    }
  }
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    if (--p.life <= 0) { powerups.splice(i, 1); continue; }
    if (!f.dead && overlap(f, p)) {
      if (p.type === "wrench") powerTimer = 360;
      if (p.type === "clock")  freezeTimer = 240;
      if (p.type === "heart")  Game.lives = Math.min(Game.lives + 1, 9);
      addPoints(150, p.x, p.y);
      Sound.powerup && Sound.powerup();
      powerups.splice(i, 1);
    }
  }

  /* --- Score popups --- */
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].y -= 0.5;
    if (--popups[i].t <= 0) popups.splice(i, 1);
  }
}

/* ---- Drawing ---- */
function drawObjects() {
  const fr = Game.frame;

  parts.forEach(p => Sprites.part(p.x - 3, p.y - 3, p.kind, fr + p.bob * 10));

  const PU = { wrench: "hammer", clock: "clock", heart: "life" };
  powerups.forEach(p => {
    if (p.life < 120 && Math.floor(p.life / 6) % 2) return; /* blink before vanishing */
    Sprites.powerup(p.x - 2, p.y - 4, PU[p.type], fr);
  });

  gremlins.forEach(g => {
    ctx.globalAlpha = g.stunned > 0 ? 0.4 : (freezeTimer > 0 ? 0.7 : 1);
    Sprites.gremlin(g.x - 5, g.y - 10, g.dir, g.animT);
    ctx.globalAlpha = 1;
  });

  bolts.forEach(b => drawBox(b.x, b.y, b.w, b.h, "#aaa"));

  ctx.font = "8px monospace"; ctx.textAlign = "center";
  popups.forEach(p => {
    ctx.fillStyle = `rgba(255,255,255,${p.t / 40})`;
    ctx.fillText(p.text, p.x + 5, p.y);
  });
  ctx.textAlign = "left";
}

/* ---- Game state (keeps any values already set in Parts 1–3) ---- */
if (typeof Game === "undefined") window.Game = {};
Game.state    = Game.state    || "title";   /* title | playing | levelclear | gameover */
Game.score    = Game.score    || 0;
Game.lives    = Game.lives    || 3;
Game.level    = Game.level    || 1;
Game.frame    = Game.frame    || 0;
Game.timer    = 0;                          /* bonus countdown, in frames */
Game.stateT   = 0;                          /* frames spent in the current state */
Game.paused   = false;

Game.hiScore  = +(localStorage.getItem("mw_hi") || 0);   /* same key as Part 1 */

const LEVEL_TIME = 60 * 90;                 /* 90 seconds at 60 fps */

function setState(s) { Game.state = s; Game.stateT = 0; }

function showTitle() {
  setState("title");
  document.getElementById("hiScore").textContent =
    "HI-SCORE " + String(Game.hiScore).padStart(6, "0");
  titleEl.classList.remove("hidden");
}

function startGame() {
  titleEl.classList.add("hidden");
  hideMessage();
  Game.score = 0; Game.lives = 3; Game.level = 1; Game.paused = false;
  Sound.start();
  startLevel(1);
}

function startLevel(n) {
  Game.level = n;
  buildLevel(n);
  spawnLevelObjects(n);
  resetFrankie();
  Game.timer = LEVEL_TIME;
  setState("playing");
  Sound.startMusic();
}

function saveHiScore() {
  if (Game.score > Game.hiScore) {
    Game.hiScore = Game.score;
    try { localStorage.setItem("mw_hi", Game.hiScore); } catch (e) {}
  }
}

/* Enter or tap starts the game; after game over, it returns to the title screen */
function pressStart() {
  unlockAudio();
  if (Game.state === "title") startGame();
  else if (Game.state === "gameover" && Game.stateT > 60) showTitle();
}
window.addEventListener("keydown", e => { if (e.code === "Enter") pressStart(); });
canvas.addEventListener("pointerdown", pressStart);


function update() {
  Game.frame++;
  Game.stateT++;

  /* Pause: P, Esc or the touch PAUSE button (all set by Part 1) */
  if (Input.pausePressed) {
    Input.pausePressed = false;
    if (Game.state === "playing") {
      Game.paused = !Game.paused;
      if (Game.paused) Sound.stopMusic(); else Sound.startMusic();
    }
  }

  if (Game.state !== "playing" || Game.paused) {
    if (Game.state === "levelclear" && Game.stateT > 180) startLevel(Game.level + 1);
    return;
  }

  updateFrankie();
  updateObjects();

  if (!frankie.dead && --Game.timer <= 0) { frankie.invuln = 0; killFrankie(); }

  if (frankie.dead && frankie.deadTimer > 90) {
    Game.lives--;
    if (Game.lives <= 0) {
      saveHiScore();
      Sound.gameover();
      setState("gameover");
    } else {
      while (parts.length < machine.need - machine.have + 1) spawnPart();
      bolts = [];
      resetFrankie();
      Game.timer = Math.max(Game.timer, 60 * 30);
      Sound.startMusic();
    }
  }

  if (machine.fixed && Game.state === "playing") {
    const bonus = Math.floor(Game.timer / 60) * 10 + 1000;
    addPoints(bonus);
    Game.lastBonus = bonus;
    saveHiScore();
    Sound.levelclear();
    setState("levelclear");
  }
}
/* ---- Drawing helpers ---- */
function text(str, x, y, size, color, align) {
  ctx.font = `${size}px monospace`;
  ctx.textAlign = align || "center";
  ctx.fillStyle = color || "#fff";
  ctx.fillText(str, x, y);
}

function drawHUD() {
  ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, HUD_H);
  text("SCORE " + Game.score, 6, 16, 10, "#fff", "left");
  text("HI " + Game.hiScore, W / 2, 16, 10, "#ffd700");
  text("LV " + Game.level + "  ♥" + Game.lives, W - 6, 16, 10, "#ff4d6d", "right");


  /* Time bar, which turns red when time is low */
  const t = Math.max(0, Game.timer / LEVEL_TIME);
  ctx.fillStyle = t < 0.25 ? "#ff4d4d" : "#4caf50";
  ctx.fillRect(0, HUD_H - 3, W * t, 3);

  /* Active power-up indicators */
  if (powerTimer > 0)  text("WRENCH " + Math.ceil(powerTimer / 60),  W - 6, HUD_H + 12, 8, "#ffd700", "right");
  if (freezeTimer > 0) text("FREEZE " + Math.ceil(freezeTimer / 60), W - 6, HUD_H + 22, 8, "#4fc3f7", "right");
  if (frankie.carrying) text("PARTS " + frankie.carrying + "/" + MAX_CARRY, 6, HUD_H + 12, 8, "#c0c0c0", "left");
}

function dim(alpha) { ctx.fillStyle = `rgba(0,0,0,${alpha})`; ctx.fillRect(0, 0, W, H); }
function blink() { return Math.floor(Game.frame / 30) % 2 === 0; }

function drawTitle() {
  ctx.fillStyle = "#0b0b1a"; ctx.fillRect(0, 0, W, H);
  text("MONKEY WRENCH", W / 2, H * 0.3, 24, "#ffd700");
  text("Help Frankie fix the broken machines!", W / 2, H * 0.3 + 26, 9, "#ccc");
  text("ARROWS / WASD  move + climb", W / 2, H * 0.55, 9, "#aaa");
  text("SPACE / Z  jump     P  pause", W / 2, H * 0.55 + 14, 9, "#aaa");
  text("HI SCORE " + Game.hiScore, W / 2, H * 0.75, 10, "#fff");
  if (blink()) text("PRESS ENTER OR TAP TO START", W / 2, H * 0.85, 10, "#fff");
}

function drawLevelClear() {
  dim(0.6);
  text(machine.name + " FIXED!", W / 2, H * 0.4, 18, "#4caf50");
  text("BONUS +" + (Game.lastBonus || 0), W / 2, H * 0.4 + 26, 11, "#ffd700");
  text("GET READY FOR LEVEL " + (Game.level + 1), W / 2, H * 0.4 + 48, 10, "#fff");
}

function drawGameOver() {
  dim(0.7);
  text("GAME OVER", W / 2, H * 0.4, 24, "#ff4d4d");
  text("SCORE " + Game.score, W / 2, H * 0.4 + 28, 11, "#fff");
  if (Game.score >= Game.hiScore && Game.score > 0)
    text("NEW HIGH SCORE!", W / 2, H * 0.4 + 46, 10, "#ffd700");
  if (Game.stateT > 60 && blink()) text("PRESS ENTER OR TAP", W / 2, H * 0.4 + 70, 10, "#fff");
}

/* ---- Render ---- */
function render() {
  ctx.clearRect(0, 0, W, H);
  if (Game.state === "title") { drawTitle(); return; }

  if (Sprites.background) Sprites.background(Game.frame);
  else { ctx.fillStyle = "#0b0b1a"; ctx.fillRect(0, 0, W, H); }

  drawLevel();
  drawObjects();
  drawFrankie();
  drawHUD();

  if (Game.paused) { dim(0.5); text("PAUSED", W / 2, H / 2, 18, "#fff"); }
  if (Game.state === "levelclear") drawLevelClear();
  if (Game.state === "gameover") drawGameOver();
}

/* ---- Fixed-step loop (same speed on 60 Hz and 120/144 Hz screens) ---- */
let lastTime = 0, acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(now - (lastTime || now), 250);
  lastTime = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  render();
  requestAnimationFrame(loop);
}

/* Build a level so the title screen has something ready, then start */
buildLevel(1);
spawnLevelObjects(1);
resetFrankie();
requestAnimationFrame(loop);
/* ===== END OF PART 4D — GAME COMPLETE ===== */
</script>
