<html><head><meta charset="utf-8"><title>MONKEY WRENCH</title>
<style>
body{margin:0;background:#111;display:flex;flex-direction:column;align-items:center;font-family:monospace;color:#eee}
canvas{border:4px solid #444;margin-top:10px}
p{margin:6px}
</style></head><body>
<canvas id="c" width="800" height="520"></canvas>
<p>← → move · ↑ ↓ climb · SPACE jump · Stomp enemies · Carry parts to the broken machine · ENTER to start</p>
<script>
window.onerror=(m,s,l)=>{alert('Error on line '+l+': '+m)};
const C=document.getElementById('c'),X=C.getContext('2d');
const K={};
onkeydown=e=>{K[e.code]=1;if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault()};
onkeyup=e=>K[e.code]=0;
// Platforms: [x, y, width]   Ladders: [x, top, bottom]
const LAYOUTS=[
 {p:[[0,490,800],[0,390,340],[420,390,380],[60,290,680],[0,190,300],[380,190,420],[250,90,300]],
  l:[[700,390,490],[90,390,490],[200,290,390],[600,290,390],[120,190,290],[520,190,290],[400,90,190]]},
 {p:[[0,490,800],[100,390,600],[0,290,250],[330,290,470],[150,190,500],[0,90,200],[600,90,200]],
  l:[[130,390,490],[640,390,490],[180,290,390],[450,290,390],[220,190,290],[560,190,290],[100,90,190],[660,90,190]]},
 {p:[[0,490,800],[0,390,250],[300,390,200],[550,390,250],[0,290,800],[100,190,250],[450,190,250],[275,90,250]],
  l:[[60,390,490],[380,390,490],[720,390,490],[200,290,390],[600,290,390],[150,190,290],[600,190,290],[300,90,190],[480,90,190]]},
 {p:[[0,490,800],[50,390,700],[0,290,350],[450,290,350],[100,190,600],[300,90,200]],
  l:[[80,390,490],[700,390,490],[300,290,390],[480,290,390],[150,190,290],[650,190,290],[340,90,190],[440,90,190]]}
];
const THEMES=[
 {name:"Joe's Diner",fix:"Grill",icon:"🍳",bg:"#3b1f1f",plat:"#c0392b",pc:"⚙️"},
 {name:"Mama Mia Pizzeria",fix:"Pizza Oven",icon:"🍕",bg:"#2b2b14",plat:"#27ae60",pc:"🔩"},
 {name:"Suds Laundromat",fix:"Washer",icon:"🧺",bg:"#14263b",plat:"#2980b9",pc:"⚙️"},
 {name:"ByteCorp Office",fix:"Copy Machine",icon:"🖨️",bg:"#222",plat:"#7f8c8d",pc:"🔌"},
 {name:"Big Burger Barn",fix:"Soda Fountain",icon:"🥤",bg:"#3b2a10",plat:"#e67e22",pc:"🔩"},
 {name:"Speedy Car Wash",fix:"Brush Motor",icon:"🚗",bg:"#102b2b",plat:"#16a085",pc:"⚙️"}
];
const PW=[{t:'clock',i:'⏰'},{t:'hammer',i:'🔨'},{t:'life',i:'❤️'},{t:'coffee',i:'☕'},{t:'wrench',i:'💥'}];
let state='title',level=0,lives=3,score=0,time,P,plats,ladders,pieces,enemies,shots,powers,machine,fixed,need,msgT=0,msg='',puTimer,fx=[];
const W=24,H=32;

function loadLevel(){
 const L=LAYOUTS[level%LAYOUTS.length],T=THEMES[level%THEMES.length];
 plats=L.p.map(a=>({x:a[0],y:a[1],w:a[2]}));
 ladders=L.l.map(a=>({x:a[0],t:a[1],b:a[2]}));
 const top=plats.reduce((a,b)=>b.y<a.y?b:a);
 machine={x:top.x+top.w/2-30,y:top.y,w:60,h:50};
 need=4+Math.min(level,6);fixed=0;
 pieces=[];for(let i=0;i<need;i++)pieces.push(placeRandom({s:'loose'}));
 enemies=[];const sp=1+level*0.15;
 const nm=1+Math.floor(level/2),ng=1+Math.floor((level+1)/2),nmu=level>=2?1:0;
 for(let i=0;i<nm;i++)enemies.push(mkEnemy('monkey',sp));
 for(let i=0;i<ng;i++)enemies.push(mkEnemy('gremlin',sp*1.2));
 for(let i=0;i<nmu;i++)enemies.push(mkEnemy('murphy',sp*0.8));
 shots=[];powers=[];fx=[];puTimer=300;
 time=Math.max(60,100-level*4)*60;
 resetPlayer();
 msg=T.name+" — Fix the "+T.fix+"!";msgT=150;
}
function placeRandom(o){
 const pl=plats[1+Math.floor(Math.random()*(plats.length-1))];
 o.x=pl.x+10+Math.random()*(pl.w-40);o.y=pl.y;return o;
}
function mkEnemy(type,sp){
 const pl=plats[1+Math.floor(Math.random()*(plats.length-1))];
 return{type,x:pl.x+Math.random()*(pl.w-28),y:pl.y,pl,dir:Math.random()<.5?-1:1,sp,stun:0,cd:120+Math.random()*120,carry:null,ct:0};
}
function respawn(e){const n=mkEnemy(e.type,e.sp);Object.assign(e,n);e.stun=120}
function resetPlayer(){P={x:30,y:490,vx:0,vy:0,climb:false,carry:null,inv:120,hammer:0,coffee:0,face:1,ground:true}}
function hurt(){
 if(P.inv>0||P.hammer>0)return;
 lives--;
 if(P.carry){P.carry.s='loose';placeRandom(P.carry);P.carry=null}
 fx.push({x:P.x,y:P.y-20,t:40,s:'OUCH!'});
 if(lives<=0){state='over';return}
 resetPlayer();
}
function onLadder(){const cx=P.x+W/2;return ladders.find(l=>cx>l.x-4&&cx<l.x+28&&P.y>=l.t-2&&P.y<=l.b+2)}
function hit(a,b,aw,ah,bw,bh){return a.x<b.x+bw&&a.x+aw>b.x&&a.y-ah<b.y&&a.y>b.y-bh}
function update(){
 if(msgT>0)msgT--;
 if(--time<=0){
  lives--;if(lives<=0){state='over';return}
  loadLevel();msg="TIME'S UP! Try again!";msgT=120;return;
 }
 const spd=P.coffee>0?5:3;
 // --- Player ---
 const lad=onLadder();
 if(lad&&((K.ArrowUp&&P.y>lad.t)||(K.ArrowDown&&P.y<lad.b))){P.climb=true;P.x=lad.x;P.vy=0}
 if(P.climb){
  if(!lad)P.climb=false;
  else{
   if(K.ArrowUp)P.y-=2.5;if(K.ArrowDown)P.y+=2.5;
   if(P.y<=lad.t){P.y=lad.t;P.climb=false;P.ground=true}
   if(P.y>=lad.b){P.y=lad.b;P.climb=false;P.ground=true}
  }
 }
 if(!P.climb){
  P.vx=(K.ArrowRight?spd:0)-(K.ArrowLeft?spd:0);if(P.vx)P.face=Math.sign(P.vx);
  if(K.Space&&P.ground){P.vy=-10;P.ground=false}
  P.vy+=0.55;const oy=P.y;P.x+=P.vx;P.y+=P.vy;
  P.x=Math.max(0,Math.min(800-W,P.x));P.ground=false;
  if(P.vy>=0)for(const pl of plats)
   if(oy<=pl.y&&P.y>=pl.y&&P.x+W>pl.x&&P.x<pl.x+pl.w){P.y=pl.y;P.vy=0;P.ground=true}
  if(P.y>540){P.inv=0;P.hammer=0;hurt();if(state!='play')return}
 }
 if(P.inv>0)P.inv--;if(P.hammer>0)P.hammer--;if(P.coffee>0)P.coffee--;
 // --- Pieces ---
 for(const pc of pieces)
  if(pc.s=='loose'&&!P.carry&&hit(P,pc,W,H,22,22)){pc.s='player';P.carry=pc;score+=50}
 if(P.carry){
  P.carry.x=P.x;P.carry.y=P.y-H;
  if(hit(P,machine,W,H,machine.w,machine.h)){
   P.carry.s='done';P.carry=null;fixed++;score+=200;
   fx.push({x:machine.x,y:machine.y-60,t:50,s:'+200 FIXED!'});
   if(fixed>=need){score+=Math.floor(time/60)*20;state='clear';return}
  }
 }
 // --- Enemies ---
 for(const e of enemies){
  if(e.stun>0){e.stun--;continue}
  if(e.type=='gremlin'&&!e.carry){
   const t=pieces.find(p=>p.s=='loose'&&p.y==e.pl.y&&p.x>e.pl.x-5&&p.x<e.pl.x+e.pl.w);
   if(t){e.dir=Math.sign(t.x-e.x)||1;if(Math.abs(t.x-e.x)<6){e.carry=t;t.s='gremlin';e.ct=150}}
  }
  if(e.carry){
   e.carry.x=e.x;e.carry.y=e.y-28;
   if(--e.ct<=0){e.carry.s='loose';placeRandom(e.carry);fx.push({x:e.x,y:e.y-30,t:40,s:'POOF! hehehe'});e.carry=null}
  }
  e.x+=e.dir*e.sp;
  if(e.x<e.pl.x){e.x=e.pl.x;e.dir=1}
  if(e.x+28>e.pl.x+e.pl.w){e.x=e.pl.x+e.pl.w-28;e.dir=-1}
  if(e.type=='monkey'&&--e.cd<=0){
   e.cd=Math.max(60,150+Math.random()*120-level*8);
   shots.push({x:e.x+14,y:e.y-20,vx:(P.x>e.x?1:-1)*(3+level*.2),vy:-4,i:'🔧'});
  }
  if(e.type=='murphy'&&--e.cd<=0){e.cd=200;shots.push({x:e.x+14,y:e.y-40,vx:0,vy:1,i:'⚡',drop:1})}
  if(hit(P,e,W,H,28,28)){
   if(P.hammer>0){score+=300;fx.push({x:e.x,y:e.y-30,t:40,s:'BONK! +300'});
    if(e.carry){e.carry.s='loose';e.carry=null}respawn(e)}
   else if(P.vy>0&&P.y-e.y<-10){
    e.stun=180;P.vy=-7;score+=100;
    if(e.carry){e.carry.s='loose';e.carry.y=e.y;e.carry=null}
    fx.push({x:e.x,y:e.y-30,t:30,s:'+100'});
   }
   else{hurt();if(state!='play')return}
  }
 }
 // --- Projectiles (thrown wrenches + lightning) ---
 for(const s of shots){s.x+=s.vx;s.y+=s.vy;s.vy+=s.drop?0.1:0.2;
  if(hit(P,s,W,H,16,16)){s.y=999;hurt();if(state!='play')return}}
 shots=shots.filter(s=>s.y<560&&s.x>-20&&s.x<820);
 // --- Power-ups ---
 if(--puTimer<=0){
  puTimer=400+Math.random()*300;
  const t=PW[Math.floor(Math.random()*PW.length)];
  if(!(t.t=='life'&&Math.random()<.5))powers.push(placeRandom({...t,life:600}));
 }
 for(const p of powers){
  p.life--;
  if(hit(P,p,W,H,22,22)){
   p.life=0;score+=50;
   if(p.t=='clock'){time+=20*60;fx.push({x:p.x,y:p.y-30,t:50,s:'+20 SEC'})}
   if(p.t=='hammer'){P.hammer=480;fx.push({x:p.x,y:p.y-30,t:50,s:'HAMMER TIME!'})}
   if(p.t=='life'){lives++;fx.push({x:p.x,y:p.y-30,t:50,s:'1-UP'})}
   if(p.t=='coffee'){P.coffee=480;fx.push({x:p.x,y:p.y-30,t:50,s:'CAFFEINATED!'})}
   if(p.t=='wrench'){
    enemies.forEach(e=>{e.stun=300;if(e.carry){e.carry.s='loose';e.carry=null}});
    shots=[];score+=500;fx.push({x:p.x,y:p.y-30,t:60,s:'SUPER WRENCH! ALL STUNNED'});
   }
  }
 }
 powers=powers.filter(p=>p.life>0);
 fx.forEach(f=>{f.t--;f.y-=.7});fx=fx.filter(f=>f.t>0);
}
// ===== PIXEL SPRITES =====
const SCALE=2;
const PAL={Y:"#ffd400",S:"#ffc890",B:"#2a5cff",R:"#e02020",K:"#5a2e0a",E:"#000",W:"#fff",
 N:"#7a4316",T:"#e0a868",G:"#3ec43e",D:"#1d6b1d",r:"#ff2020",L:"#c8c8d0",M:"#707080",O:"#ff8c00"};
function makeSprite(rows,swap){
 const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;
 const g=c.getContext('2d');
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let ch=rows[y][x];if(!ch)continue;
  if(swap&&swap[ch])ch=swap[ch];if(PAL[ch]){g.fillStyle=PAL[ch];g.fillRect(x,y,1,1)}}
 return c;
}
// Frankie 12x16 -> 24x32 on screen
const F_HEAD=["....YYYY....","...YYYYYY...","..YYYYYYYYYY","...SSSSSS...","...SSSESS...","...SSSSSSS..","...SSKKKS...","....SSSS...."];
const F_BACK=["....YYYY....","...YYYYYY...","..YYYYYYYY..","...SSSSSS...","...SSSSSS...","...SSSSSS...","...SSSSSS...","....SSSS...."];
const F_ARMD=["..RRBRRBRR..",".SRRBBBBRRS.",".S.BBYBBB.S.","...BBBBBB..."];
const F_ARMU=["S.RRBRRBRR.S","SRRRBBBBRRRS","...BBYBBB...","...BBBBBB..."];
const F_LEG={stand:["...BB..BB...","...BB..BB...","...BB..BB...","..KKK..KKK.."],
 walk1:["..BB....BB..",".BB......BB.",".BB......BB.","KKK......KKK"],
 walk2:["....BBBB....","....BBBB....","....BBBB....","...KKKKKK..."],
 jump:["..BB....BB..","..BB....BB..",".KKK....KKK.","............"]};
const FR={stand:makeSprite([...F_HEAD,...F_ARMD,...F_LEG.stand]),walk1:makeSprite([...F_HEAD,...F_ARMD,...F_LEG.walk1]),
 walk2:makeSprite([...F_HEAD,...F_ARMD,...F_LEG.walk2]),jump:makeSprite([...F_HEAD,...F_ARMU,...F_LEG.jump]),
 climb1:makeSprite([...F_BACK,...F_ARMU,...F_LEG.walk1]),climb2:makeSprite([...F_BACK,...F_ARMU,...F_LEG.stand])};
// Monkey 14x14 -> 28x28
const M_HEAD=["....NNNNNN....","...NNNNNNNN...","..NNTTNNTTNN..",".TNTETTTTETNT.",".TNTTTTTTTTNT.","..NNTTKKTTNN..","...NNTTTTNN...","....NNNNNN...."];
const M_FEET=["....NN..NN....","...TTT..TTT...",".............."];
const MK={idle:makeSprite([...M_HEAD,"..NNNNNNNNNN..",".NN.NNTTNN.NN.",".TT.NNTTNN.TT.",...M_FEET]),
 throw:makeSprite([...M_HEAD,"TT..NNNNNN..TT",".NN.NNTTNN.NN.","..NNNNTTNNNN..",...M_FEET])};
// Gremlin 12x12 -> 24x24
const G_TOP=["G..........G","GG..GGGG..GG",".GGGGGGGGGG.","..GrGGGGrG..","..GGGGGGGG..","..GWDWDWDG..","...GGGGGG...","..DGGGGGGD..",".D.GGGGGG.D.","...GG..GG..."];
const GR={a:makeSprite([...G_TOP,"..GG....GG..","............"]),b:makeSprite([...G_TOP,"....GGGG....","............"])};
// Murphy storm cloud 14x10 -> 28x20
const CLOUD=makeSprite(["....LLLL......","..LLLLLLLL....",".LLLLLLLLLLL..","LLLELLLLELLLL.","LLLLLLLLLLLLLL",
 ".MMMMMMMMMMMM.","....YY...YY...","...YY...YY....","....Y....Y....",".............."]);
// Wrench 10x10 -> 20x20
const WR_ART=["..LL......",".L..L.....",".L..L.....","..LLL.....","....LL....",".....LL...","......LL..",".......LL.","........LM",".........M"];
const WR={normal:makeSprite(WR_ART),super:makeSprite(WR_ART,{L:"Y",M:"O"})};

function blit(img,x,y,flip){
 const w=img.width*SCALE,h=img.height*SCALE;x=Math.round(x);y=Math.round(y);
 if(flip){X.save();X.translate(x+w,y);X.scale(-1,1);X.drawImage(img,0,0,w,h);X.restore()}
 else X.drawImage(img,x,y,w,h);
}
function spin(img,cx,cy,a){const w=img.width*SCALE,h=img.height*SCALE;
 X.save();X.translate(cx,cy);X.rotate(a);X.drawImage(img,-w/2,-h/2,w,h);X.restore()}

const SP={
 ladder(x,t,h){X.fillStyle='#00c8ff';X.fillRect(x,t,4,h);X.fillRect(x+20,t,4,h);
  for(let y=t+8;y<t+h;y+=12)X.fillRect(x,y,24,3);
  X.fillStyle='#0088aa';X.fillRect(x+3,t,1,h);X.fillRect(x+23,t,1,h)},
 girder(x,y,w,col){X.fillStyle=col;X.fillRect(x,y,w,10);
  X.fillStyle='rgba(255,255,255,.35)';X.fillRect(x,y,w,2);
  X.fillStyle='rgba(0,0,0,.45)';for(let i=x;i<x+w;i+=14){X.fillRect(i+3,y+4,3,3);X.fillRect(i+9,y+4,3,3)}},
 machine(m,label,prog,t){const x=m.x,y=m.y-m.h,done=prog>=1;
  X.fillStyle=done?'#2a8c2a':'#555';X.fillRect(x,y,m.w,m.h);
  X.fillStyle='#333';X.fillRect(x,y,m.w,4);
  X.fillStyle='#222';X.fillRect(x+8,y+8,m.w-16,18);
  X.fillStyle=done?(Math.floor(t/10)%2?'#7fff7f':'#3ec43e'):'#900';
  X.fillRect(x+10,y+10,(m.w-20)*prog,14);
  if(!done&&Math.floor(t/6)%2){X.fillStyle='#ffd400';
   X.fillRect(x+m.w-8+Math.random()*6,y+Math.random()*12,3,3);
   X.fillStyle='rgba(160,160,160,.5)';X.fillRect(x+24+Math.sin(t*.1)*5,y-10-(t%24)/2,8,8)}
  X.fillStyle='#ffd400';X.fillRect(x+6,y+m.h-14,m.w-12,3);
  text(label,x+m.w/2,y-6,11,'#ff0')},
 part(x,y,kind,t){const by=y+Math.sin(t*.1+x)*2;X.save();X.translate(x+10,by+10);
  if(kind===0){X.rotate(t*.05);X.fillStyle='#ccc';for(let i=0;i<6;i++){X.rotate(Math.PI/3);X.fillRect(-2,-9,4,4)}
   X.beginPath();X.arc(0,0,6,0,7);X.fill();X.fillStyle='#000';X.beginPath();X.arc(0,0,2,0,7);X.fill()}
  else if(kind===1){X.fillStyle='#ffd400';X.fillRect(-7,-7,14,5);X.fillRect(-2,-2,4,10)}
  else if(kind===2){X.fillStyle='#3a9cff';X.fillRect(-8,-3,16,6);X.fillStyle='#1a5c9f';X.fillRect(-9,-5,3,10);X.fillRect(6,-5,3,10)}
  else{X.fillStyle='#1d6b1d';X.fillRect(-7,-6,14,12);X.fillStyle='#ffd400';
   for(let i=-6;i<7;i+=3){X.fillRect(i,-8,1,2);X.fillRect(i,6,1,2)}}
  X.restore();if(Math.floor(t/10)%3===0){X.fillStyle='#fff';X.fillRect(x+17,by,2,2)}},
 powerup(x,y,type,t){const by=y+Math.sin(t*.15)*3;
  X.fillStyle=Math.floor(t/8)%2?'#fff':'#ffd400';X.fillRect(x-1,by-1,22,22);
  X.fillStyle='#000';X.fillRect(x,by,20,20);X.save();X.translate(x+10,by+10);
  if(type=='clock'){X.fillStyle='#fff';X.beginPath();X.arc(0,0,7,0,7);X.fill();X.fillStyle='#000';X.fillRect(-1,-6,2,6);X.fillRect(0,-1,5,2)}
  else if(type=='hammer'){X.fillStyle='#8b5a2b';X.fillRect(-1,-2,3,10);X.fillStyle='#aaa';X.fillRect(-7,-7,14,6)}
  else if(type=='life'){X.fillStyle='#e02020';X.fillRect(-7,-5,6,6);X.fillRect(1,-5,6,6);X.fillRect(-6,0,12,3);X.fillRect(-4,3,8,2);X.fillRect(-2,5,4,2)}
  else if(type=='coffee'){X.fillStyle='#fff';X.fillRect(-6,-3,10,10);X.fillRect(4,-1,3,5);X.fillStyle='#5a2e0a';X.fillRect(-5,-2,8,2);
   X.fillStyle='#aaa';X.fillRect(-4,-8+(t%10>5?1:0),1,3);X.fillRect(0,-8,1,3)}
  else spin(WR.super,0,0,t*.1);
  X.restore()},
 bolt(x,y){X.strokeStyle='#fff';X.lineWidth=3;X.beginPath();X.moveTo(x+8,y-16);X.lineTo(x+3,y-8);X.lineTo(x+10,y-8);X.lineTo(x+5,y);X.stroke();
  X.strokeStyle='#ffd400';X.lineWidth=1.5;X.stroke()},
 hammer(x,y,face,t){const up=Math.floor(t/6)%2,hx=face>0?x+22:x-12,hy=up?y-36:y-20;
  X.fillStyle='#8b5a2b';X.fillRect(hx+4,hy+5,3,12);X.fillStyle='#aaa';X.fillRect(hx-1,hy,13,7)}
};
let FC=0; // animation frame counter (visual only)
function emoji(s,x,y,sz=24){X.font=sz+'px serif';X.textAlign='left';X.fillText(s,x,y)}
function text(s,x,y,sz=16,c='#fff',a='center'){X.font='bold '+sz+'px monospace';X.fillStyle=c;X.textAlign=a;X.fillText(s,x,y)}

function draw(){
 FC++;X.imageSmoothingEnabled=false;
 const T=THEMES[level%THEMES.length];
 X.fillStyle=T.bg;X.fillRect(0,0,800,520);
 X.globalAlpha=.08;for(let i=0;i<8;i++)emoji(T.icon,i*110+20,60+(i%3)*150,60);X.globalAlpha=1;
 for(const l of ladders)SP.ladder(l.x,l.t,l.b-l.t);
 for(const p of plats)SP.girder(p.x,p.y,p.w,T.plat);
 SP.machine(machine,T.fix,fixed/need,FC);
 pieces.forEach((pc,i)=>{if(pc.s!='done')SP.part(pc.x,pc.y-20,i%4,FC)});
 for(const p of powers)if(p.life>120||p.life%20<10)SP.powerup(p.x,p.y-22,p.t,FC);
 // Enemies
 for(const e of enemies){
  X.globalAlpha=e.stun>0?.5:1;
  if(e.type=='monkey')blit(e.cd<20&&e.stun<=0?MK.throw:MK.idle,e.x,e.y-28+(Math.floor(FC/15)%2?-2:0));
  else if(e.type=='gremlin')blit(Math.floor(FC/6)%2?GR.a:GR.b,e.x+2,e.y-24+(Math.floor(FC/6)%2?-1:0),e.dir<0);
  else blit(CLOUD,e.x,e.y-34+Math.sin(FC*.08)*3);
  if(e.stun>0){X.fillStyle='#ffd400';for(let i=0;i<3;i++){const a=FC*.15+i*2.1;

  X.globalAlpha=1;
 }

 for(const s of shots){if(s.drop)SP.bolt(s.x,s.y);else spin(WR.normal,s.x+8,s.y-8,FC*.3)}

  if(P.hammer>0)SP.hammer(P.x,P.y,P.face,FC);
  if(P.coffee>0&&FC%4<2){X.fillStyle='#ffd400';X.fillRect(P.x+Math.random()*24,P.y-36+Math.random()*30,2,2)}
 }
 for(const f of fx)text(f.s,f.x+12,f.y,14,'#ff0');
 // HUD
 X.fillStyle='rgba(0,0,0,.6)';X.fillRect(0,0,800,26);

 text('SCORE '+score,10,18,15,'#fff','left');

 text('❤️x'+lives+'  ⏱'+sec,790,18,15,sec<=15?'#f44':'#fff','right');
 text('PARTS '+fixed+'/'+need,10,512,13,'#0f0','left');
 if(msgT>0)text(msg,400,250,24,'#ff0');
}
